name: Deploy to Shopify Oxygen

# Deploy runs *after* CI finishes, not alongside it. The previous `push` trigger
# raced CI: a `verify-ci` job that listed only completed check runs saw an empty
# list at that moment and passed vacuously, so a red build still shipped.
on:
  workflow_run:
    workflows: ['CI']
    branches:
      - main
    types:
      - completed
  workflow_dispatch: # Allow manual deployment

permissions:
  contents: read
  deployments: write

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oxygen
    # workflow_dispatch has no workflow_run payload, so it deploys unconditionally.
    # `branches: main` above matches the triggering run's *head branch name*, which a
    # fork PR can also call `main`. Only deploy CI runs from a push to this repo.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # Build the exact commit CI validated, not whatever main points at now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `hydrogen deploy` builds before uploading; a separate build step built twice.
      - name: Build and deploy to Oxygen
        run: pnpm exec shopify hydrogen deploy --build-command "pnpm build"
        env:
          NODE_ENV: production
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000087092 }}

      - name: Notify deployment success
        if: success()
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "✅ Deployment to Shopify Oxygen successful"
          echo "Branch: $BRANCH"
          echo "Commit: $COMMIT"
          echo "Deployed by: $ACTOR"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment to Shopify Oxygen failed"
          echo "Check logs above for details"
        continue-on-error: true
